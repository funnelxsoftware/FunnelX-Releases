name: Discord Release Notifier

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Webhook
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          TITLE="${RELEASE_NAME:-FunnelX Update - v1.1.4}"
          
          if [ -z "$RELEASE_BODY" ]; then
            READABLE_BODY=$(cat << 'EOF'
### 🔧 Compatibility Update

* ✅ Updated offsets for the latest game patch
* ✅ Re-uploaded FunnelX.exe with new memory addresses

**Important:** This update is **required** for FunnelX to work with the current game version. The old .exe will no longer function.
EOF
            )
          else
            READABLE_BODY="$RELEASE_BODY"
          fi

          MESSAGE="# 📢 $TITLE

$READABLE_BODY

👀 *Keep an eye on this channel for future updates!*
<@&1530655440357163189>"

          jq -n \
            --arg content "$MESSAGE" \
            '{content: $content, allowed_mentions: {roles: ["1530655440357163189"]}}' \
            > payload.json
            
          curl -H "Content-Type: application/json" -d @payload.json $DISCORD_WEBHOOK
