name: Discord Release Notifier

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Webhook
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          python3 -c '
          import os, json, urllib.request

          webhook = os.getenv("DISCORD_WEBHOOK")
          
          # Pakt automatisch jouw ingevulde Release Notes van GitHub
          fallback_body = "### 🔧 Compatibility Update\n\n* ✅ Updated offsets for the latest game patch\n* ✅ Re-uploaded FunnelX.exe with new memory addresses\n\n**Important:** This update is **required** for FunnelX to work with the current game version. The old .exe will no longer function."
          body = os.getenv("RELEASE_BODY") or fallback_body

          # Plakt jouw vaste footer onder jouw Release Notes
          message = f"{body}\n\n👀 *Keep an eye on this channel for future updates!*\n<@&1530655440357163189>"

          payload = json.dumps({
              "content": message,
              "allowed_mentions": {"roles": ["1530655440357163189"]}
          }).encode("utf-8")

          headers = {
              "Content-Type": "application/json",
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
          }

          req = urllib.request.Request(webhook, data=payload, headers=headers)
          urllib.request.urlopen(req)
          '
